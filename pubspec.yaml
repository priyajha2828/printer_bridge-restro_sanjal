name: RestroSanjalBridge
description: RestroSanjal Print Bridge (Flutter/Dart port)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  provider: ^6.1.2
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_background: ^1.3.1
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.0

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - asset/images/logo.png
    - asset/images/splash_logo.png
